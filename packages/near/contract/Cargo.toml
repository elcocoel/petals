[package]
name = "petals-credit"
description = "Petals' credit contract: each person's NEAR for Petals' agent, kept under their own account, theirs to take back."
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
